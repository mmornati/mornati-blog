name: Deploy blog

on:
  push:
    branches: [main]
    paths: ['content/**', 'config/**', 'layouts/**', 'assets/**', 'i18n/**', 'static/**', 'themes/blowfish/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDINARY_FOLDER: blog

permissions:
  contents: write
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Capture previously-deployed sitemap URLs
        run: |
          : > old-urls.txt
          if git fetch --depth=1 origin deploy 2>/dev/null; then
            for lang in en it fr; do
              if git cat-file -e "origin/deploy:${lang}/sitemap.xml" 2>/dev/null; then
                git show "origin/deploy:${lang}/sitemap.xml" \
                  | grep -o '<loc>[^<]*</loc>' \
                  | sed 's/<loc>//; s#</loc>##' >> old-urls.txt
              fi
            done
          else
            echo "WARN: could not fetch deploy branch; treating old set as empty" >&2
          fi
          sort -u -o old-urls.txt old-urls.txt
          echo "Previously-deployed URLs: $(wc -l < old-urls.txt)"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: blog-mornati-net
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: "697630817943"
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          hugo --minify --gc --baseURL https://blog.mornati.net/
          python3 scripts/generate_redirects.py

      - name: Cache Cloudinary sync state
        uses: actions/cache@v4
        with:
          path: build/cloudinary.synced.json
          key: cloudinary-sync-${{ runner.os }}-${{ hashFiles('static/images/**', 'scripts/cloudinary_sync.py') }}
          restore-keys: |
            cloudinary-sync-${{ runner.os }}-
          save-always: true

      - name: Sync images to Cloudinary + rewrite HTML
        if: env.CLOUDINARY_CLOUD_NAME != ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python3 scripts/cloudinary_sync.py

      - name: Deploy static site to 'deploy' branch for Coolify
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: deploy
          allow_empty_commit: true
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Upload previously-deployed URLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: old-urls.txt
          if-no-files-found: error

  ping-indexnow:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download previously-deployed URLs
        uses: actions/download-artifact@v4
        with:
          name: indexnow-state

      - name: Extract deployed sitemap URLs
        run: |
          git fetch --depth=1 origin deploy
          : > new-urls.txt
          for lang in en it fr; do
            if git cat-file -e "origin/deploy:${lang}/sitemap.xml" 2>/dev/null; then
              git show "origin/deploy:${lang}/sitemap.xml" \
                | grep -o '<loc>[^<]*</loc>' \
                | sed 's/<loc>//; s#</loc>##' >> new-urls.txt
            fi
          done
          sort -u -o new-urls.txt new-urls.txt
          echo "Deployed URLs: $(wc -l < new-urls.txt)"

      - name: Ping IndexNow with new articles only
        run: |
          python3 - <<'EOF'
          import json, os, sys, time
          import urllib.request, urllib.error

          host = "blog.mornati.net"
          key = "4bf0e788f76f694c10bbf95ec4569a66"
          key_location = f"https://{host}/{key}.txt"

          def read_urls(path):
              if not os.path.exists(path):
                  return set()
              with open(path) as f:
                  return {ln.strip() for ln in f if ln.strip()}

          old = read_urls("old-urls.txt")
          new = read_urls("new-urls.txt")
          delta = sorted(new - old)
          print(f"old={len(old)} new={len(new)} delta={len(delta)}")

          if not delta:
              print("No new articles in this deploy; skipping IndexNow ping")
              sys.exit(0)

          failed = False
          for i in range(0, len(delta), 9000):
              batch = delta[i:i + 9000]
              payload = {
                  "host": host,
                  "key": key,
                  "keyLocation": key_location,
                  "urlList": batch,
              }
              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json; charset=utf-8"},
              )
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          print(f"IndexNow batch {i // 9000 + 1}: HTTP {resp.status} ({len(batch)} URLs)")
                          break
                  except urllib.error.HTTPError as e:
                      if e.code == 429:
                          wait = 10 * (attempt + 1)
                          print(f"Rate limited (429); retrying in {wait}s")
                          time.sleep(wait)
                          continue
                      if e.code == 403 and "SiteVerificationNotCompleted" in e.read().decode():
                          wait = 30 * (attempt + 1)
                          print(f"Site verification pending (403); retrying in {wait}s")
                          time.sleep(wait)
                          continue
                      print(f"IndexNow HTTP {e.code}: {e.read().decode()}")
                      failed = True
                      break
                  except Exception as e:
                      print(f"IndexNow request error: {e}")
                      failed = True
                      break
              else:
                  print(f"IndexNow batch {i // 9000 + 1}: failed after retries")
                  failed = True

          if failed:
              sys.exit(1)
          EOF
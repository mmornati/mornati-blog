name: Deploy blog

on:
  push:
    branches: [main]
    paths: ['content/**', 'config/**', 'layouts/**', 'assets/**', 'i18n/**', 'static/**', 'themes/blowfish/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDINARY_FOLDER: blog

permissions:
  contents: write
  actions: write

jobs:
  build-and-deploy:
    # CircleCI is the primary provider: with CI_PROVIDER=circleci this job is skipped and costs
    # nothing. scripts/ci/provider.sh switches; a manual run ignores the switch.
    if: vars.CI_PROVIDER != 'circleci' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Capture previously-deployed sitemap URLs
        run: bash scripts/ci/sitemap_urls.sh old-urls.txt

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: blog-mornati-net
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: "697630817943"
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: bash scripts/ci/build.sh

      - name: Cache Cloudinary sync state
        uses: actions/cache@v4
        with:
          path: build/cloudinary.synced.json
          key: cloudinary-sync-${{ runner.os }}-${{ hashFiles('static/images/**', 'scripts/cloudinary_sync.py') }}
          restore-keys: |
            cloudinary-sync-${{ runner.os }}-
          save-always: true

      - name: Sync images to Cloudinary + rewrite HTML
        if: env.CLOUDINARY_CLOUD_NAME != ''
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python3 scripts/cloudinary_sync.py

      - name: Deploy static site to 'deploy' branch for Coolify
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: deploy
          allow_empty_commit: true
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Upload previously-deployed URLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: old-urls.txt
          if-no-files-found: error

  ping-indexnow:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download previously-deployed URLs
        uses: actions/download-artifact@v4
        with:
          name: indexnow-state

      - name: Ping IndexNow with new articles only
        run: |
          bash scripts/ci/sitemap_urls.sh new-urls.txt
          python3 scripts/ci/indexnow.py old-urls.txt new-urls.txt

name: Publish scheduled posts

# The scheduled/publication batch runs on CircleCI (see .circleci/config.yml, `scheduled`
# workflow): GitHub Actions scheduled workflows proved not to be run reliably, which is why the
# hourly publication moved back to CircleCI while the build itself is back on GitHub Actions.
#
# Manual runs of this workflow are still available as an ops escape hatch: check the due posts
# and dispatch the GitHub deploy workflow (which builds with the OpenObserve RUM secrets) when a
# future-dated post became due.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch last deploy time
        run: git fetch origin deploy --depth=1 || true

      - name: Check for due posts
        id: check
        run: |
          OUT=$(python3 scripts/next_scheduled_post.py)
          echo "status=$OUT" >> "$GITHUB_OUTPUT"

      - name: Nothing scheduled
        if: steps.check.outputs.status == ''
        run: echo "No future-dated posts; skipping."

      - name: Not due yet
        if: steps.check.outputs.status != '' && steps.check.outputs.status != 'DUE'
        run: echo "Next scheduled post at ${{ steps.check.outputs.status }}; not due yet."

      - name: Trigger deploy
        if: steps.check.outputs.status == 'DUE'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

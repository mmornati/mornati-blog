name: Open source sync

# Keeps the /open-source/ gallery fresh: refreshes data/opensource_stats.json (stars, descriptions)
# and takes a screenshot for any project in data/opensource.yaml that does not have one yet.
# Commits the result to main and dispatches the deploy workflow when something changed.
# Run it by hand with "retake every screenshot" after a project's site was redesigned.
#
# Two jobs on purpose: `capture` opens external websites in a browser, so it runs read-only, keeps
# no git credentials, and takes its screenshots in a step that has no token at all. `publish` holds
# the write permission and only ever handles the files `capture` produced.

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      refresh_shots:
        description: Retake every screenshot
        type: boolean
        default: false

concurrency:
  group: opensource-sync
  cancel-in-progress: false

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Refresh stats (GitHub API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_opensource.py --no-shots

      - name: Take screenshots (no token in this step)
        env:
          REFRESH: ${{ inputs.refresh_shots && '--refresh-shots' || '' }}
        run: python3 scripts/sync_opensource.py --no-stats $REFRESH

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: opensource-sync
          path: |
            data/opensource_stats.json
            assets/opensource/*.webp
          if-no-files-found: error

  publish:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: opensource-sync

      - name: Commit and deploy when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/opensource_stats.json assets/opensource
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Open source gallery: refresh stars and screenshots"
          git push
          # A push made with the workflow token does not trigger other workflows.
          gh workflow run deploy.yml --ref main

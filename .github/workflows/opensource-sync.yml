name: Open source sync

# Keeps the /open-source/ gallery fresh: refreshes data/opensource_stats.json (stars, descriptions)
# and takes a screenshot for any project in data/opensource.yaml that does not have one yet.
# Commits the result to main and dispatches the deploy workflow when something changed.
# Run it by hand with "retake every screenshot" after a project's site was redesigned.

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      refresh_shots:
        description: Retake every screenshot
        type: boolean
        default: false

concurrency:
  group: opensource-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Refresh stats and screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh_shots && '--refresh-shots' || '' }}
        run: python3 scripts/sync_opensource.py $REFRESH

      - name: Commit and deploy when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/opensource_stats.json assets/opensource
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Open source gallery: refresh stars and screenshots"
          git push
          # A push made with the workflow token does not trigger other workflows.
          gh workflow run deploy.yml --ref main

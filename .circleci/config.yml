# Blog CI/CD on GitHub Actions — the primary provider again (CircleCI handles the publication batch only).
#
# .github/workflows/ is the source of truth for the build and the deploy:
#   ci.yml              build + validate (every branch push except main / PRs)
#   deploy.yml          build + validate, Cloudinary sync, publish to the `deploy` branch, ping IndexNow
#                       (pushes to main with site-path changes, plus manual dispatch for forced deploys)
#   publish-scheduled.yml  manual runs only: check for due future-dated posts, dispatch deploy.yml when DUE
#
# CircleCI is kept only for the "publication" batch (the hourly scheduled deploy of a future-dated
# post). The `ci` and `deploy` workflows are DISABLED: the build is back on GitHub Actions, where the
# OpenObserve RUM secrets live (wired into the `Build site` steps of .github/workflows/ci.yml and
# deploy.yml). Keeping CircleCI for the scheduled publication is the backstop for the hourly batch,
# since GitHub Actions scheduled workflows proved not to run reliably.
#
# Workflows (picked by the `trigger` pipeline parameter):
#   scheduled  hourly schedule trigger with trigger=scheduled. Deploys only when a future-dated
#              post became due; otherwise stops after a few seconds (before installing Hugo).
#
# Project settings:
#   env vars  FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_STORAGE_BUCKET, FIREBASE_APP_ID,
#             FIREBASE_MEASUREMENT_ID, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
#           + OPENOBSERVE_RUM_TOKEN, OPENOBSERVE_RUM_APP_ID, OPENOBSERVE_RUM_SITE (+ optional
#           OPENOBSERVE_RUM_ORGANIZATION / OPENOBSERVE_RUM_SERVICE / OPENOBSERVE_RUM_ENV /
#           OPENOBSERVE_RUM_VERSION) for the scheduled publication builds
#   SSH key   additional key for host github.com: the private half of the repository's write deploy
#             key "circleci-deploy" (fingerprint below).

version: 2.1

parameters:
  trigger:
    type: enum
    enum: [push, scheduled, manual]
    default: push

executors:
  python:
    docker:
      - image: cimg/python:3.13.16
    # Hugo uses every core: on `small` (1 vCPU) the build takes ~3m40s, on `medium` about half
    # for the same credits.
    resource_class: medium
    environment:
      FIREBASE_PROJECT_ID: blog-mornati-net
      FIREBASE_MESSAGING_SENDER_ID: "697630817943"
      CLOUDINARY_FOLDER: blog

commands:
  site:
    description: Install Hugo, check out the theme submodule, build and validate public/.
    steps:
      - run:
          name: Theme submodule
          command: git submodule sync --recursive && git submodule update --init --recursive --depth 1
      - run:
          name: Install Hugo
          command: bash scripts/ci/install_hugo.sh
      - run:
          name: Build site
          command: bash scripts/ci/build.sh
      - run:
          name: Validate output
          command: bash scripts/ci/validate.sh

jobs:
  build:
    executor: python
    steps:
      - checkout
      - site

  deploy:
    executor: python
    parameters:
      trigger:
        type: enum
        enum: [push, scheduled, manual]
      resource_class:
        type: enum
        enum: [small, medium]
        default: medium
    resource_class: << parameters.resource_class >>
    environment:
      DEPLOY_KEY_FINGERPRINT: SHA256:wwiWkBV8aOMpEFkvGvfWR2abEGHM92kjseCHaK9etng
    steps:
      - checkout
      # The hourly check runs before Hugo is installed, so a run with nothing due stays short.
      - run:
          name: Anything to publish?
          command: bash scripts/ci/deploy_gate.sh << parameters.trigger >> || circleci-agent step halt
      # The OpenObserve RUM snippet is rendered at build time when the env vars are set (the
      # scheduled publication builds must embed it too). Each run step is a new shell on CircleCI,
      # so the values (CircleCI project environment variables) are exported through $BASH_ENV.
      - run:
          name: Export OpenObserve RUM env vars
          command: |
            echo 'export OPENOBSERVE_RUM_TOKEN="${OPENOBSERVE_RUM_TOKEN:-}"' >> "$BASH_ENV"
            echo 'export OPENOBSERVE_RUM_APP_ID="${OPENOBSERVE_RUM_APP_ID:-}"' >> "$BASH_ENV"
            echo 'export OPENOBSERVE_RUM_SITE="${OPENOBSERVE_RUM_SITE:-}"' >> "$BASH_ENV"
            echo 'export OPENOBSERVE_RUM_ORGANIZATION="${OPENOBSERVE_RUM_ORGANIZATION:-default}"' >> "$BASH_ENV"
            echo 'export OPENOBSERVE_RUM_SERVICE="${OPENOBSERVE_RUM_SERVICE:-blog}"' >> "$BASH_ENV"
            echo 'export OPENOBSERVE_RUM_ENV="${OPENOBSERVE_RUM_ENV:-production}"' >> "$BASH_ENV"
            echo 'export OPENOBSERVE_RUM_VERSION="${OPENOBSERVE_RUM_VERSION:-}"' >> "$BASH_ENV"
      - site
      - run:
          name: Previously deployed sitemap URLs
          command: bash scripts/ci/sitemap_urls.sh /tmp/old-urls.txt
      - run:
          name: Cloudinary sync state key
          command: |
            { sha256sum scripts/cloudinary_sync.py; find static/images -type f -print0 | sort -z | xargs -0 sha256sum; } \
              | sha256sum > /tmp/cloudinary-key
      - restore_cache:
          keys:
            - cloudinary-sync-v1-{{ checksum "/tmp/cloudinary-key" }}
            - cloudinary-sync-v1-
      - run:
          name: Sync images to Cloudinary + rewrite HTML
          command: |
            if [[ -z "${CLOUDINARY_CLOUD_NAME:-}" ]]; then
              echo "CLOUDINARY_CLOUD_NAME not set; skipping"
              exit 0
            fi
            python3 scripts/cloudinary_sync.py
      - save_cache:
          when: always
          key: cloudinary-sync-v1-{{ checksum "/tmp/cloudinary-key" }}
          paths:
            - build/cloudinary.synced.json
      - add_ssh_keys:
          fingerprints:
            - SHA256:wwiWkBV8aOMpEFkvGvfWR2abEGHM92kjseCHaK9etng
      - run:
          name: Publish public/ to the deploy branch
          command: bash scripts/ci/publish.sh
      - run:
          name: Ping IndexNow with new articles only
          command: |
            bash scripts/ci/sitemap_urls.sh /tmp/new-urls.txt
            python3 scripts/ci/indexnow.py /tmp/old-urls.txt /tmp/new-urls.txt

workflows:
  # DISABLED — the build is back on GitHub Actions (.github/workflows/ci.yml + deploy.yml); the
  # OpenObserve RUM secrets are wired there. Re-enable (build/deploy) only if GitHub Actions ever
  # becomes the secondary provider again.
  #
  # ci:
  #   when:
  #     and:
  #         - equal: [push, << pipeline.parameters.trigger >>]
  #         - not:
  #             equal: [main, << pipeline.git.branch >>]
  #   jobs:
  #     - build

  # DISABLED — same reason as `ci` above; scheduled publication is handled by the `scheduled`
  # workflow below, manual/forced publishes by .github/workflows/deploy.yml workflow_dispatch.
  #
  # deploy:
  #   when:
  #     and:
  #         - equal: [main, << pipeline.git.branch >>]
  #         - or:
  #             - equal: [push, << pipeline.parameters.trigger >>]
  #             - equal: [manual, << pipeline.parameters.trigger >>]
  #   jobs:
  #     - deploy:
  #         trigger: << pipeline.parameters.trigger >>
  #         # One deploy at a time: each one force-pushes the deploy branch.
  #         serial-group: << pipeline.project.slug >>/deploy

  # ACTIVE — the hourly publication batch: deploy only when a future-dated post became due.
  scheduled:
    when:
      equal: [scheduled, << pipeline.parameters.trigger >>]
    jobs:
      - deploy:
          trigger: scheduled
          # ~720 runs a month that almost always stop at the gate: the smallest class is enough.
          resource_class: small
          serial-group: << pipeline.project.slug >>/deploy

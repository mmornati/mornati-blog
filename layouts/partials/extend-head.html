<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/avatar.jpg">

<!-- Home-lab notebook type system: Shantell Sans (headings, nav, annotations), Atkinson Hyperlegible (body, prose), Fragment Mono (code, dates, figures) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght,BNCE,INFM@400..800,-100..100,0..100&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Fragment+Mono:ital@0;1&display=swap"
  rel="stylesheet">
{{- $js := resources.Get "js/previews.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{- $nb := resources.Get "js/notebook.js" | minify | fingerprint }}
<script src="{{ $nb.RelPermalink }}" integrity="{{ $nb.Data.Integrity }}" defer></script>
